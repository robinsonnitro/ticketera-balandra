<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Ticketera Balandra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy2:#0d1e35;--navy3:#142540;--gold:#D4AF37;--goldDim:rgba(212,175,55,.18);--goldBdr:rgba(212,175,55,.35);--white:#f0f4f8;--muted:rgba(240,244,248,.6);--dim:rgba(240,244,248,.35);--green:#00e87a;--red:#ff5f5f;--card:rgba(255,255,255,.07);--bdr:rgba(255,255,255,.1);--r:14px;--rs:10px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#shell{display:flex;flex-direction:column;min-height:100dvh}
#topbar{background:var(--navy2);border-bottom:1px solid var(--goldBdr);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.brand{cursor:pointer}.brand-name{color:var(--gold);font-size:17px;font-weight:700;letter-spacing:3px}.brand-sub{color:var(--dim);font-size:10px;margin-top:1px}
#content{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%;padding-bottom:calc(76px + var(--sb))}
#bnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy2);border-top:1px solid var(--bdr);display:flex;padding-bottom:var(--sb);z-index:200}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:3px;cursor:pointer;border:none;background:none;color:var(--dim);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;transition:color .15s}
.nb.active{color:var(--gold)}.nb-icon{font-size:22px;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:var(--rs);cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;border:1px solid;transition:opacity .15s;min-height:44px}
.btn:active{opacity:.75}.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn-ghost{background:transparent;border-color:var(--goldBdr);color:var(--gold)}.btn-dim{background:transparent;border-color:var(--bdr);color:var(--muted)}.btn-green{background:var(--green);border-color:var(--green);color:var(--navy)}.btn-full{width:100%;padding:16px;font-size:16px;border-radius:var(--r);min-height:52px}.btn:disabled{opacity:.4;cursor:not-allowed}
.input{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--bdr);background:rgba(255,255,255,.06);color:var(--white);font-size:16px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;min-height:52px}.input:focus{border-color:var(--goldBdr)}
.input-folio{text-align:center;letter-spacing:4px;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700}
.input-code{text-align:center;letter-spacing:10px;font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;padding:20px 16px}
.label{color:var(--muted);font-size:13px;font-weight:600;display:block;margin-bottom:8px}.field{margin-bottom:16px}.err{color:var(--red);font-size:13px;text-align:center;padding:8px 0}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:18px}.card-gold{border-color:var(--goldBdr)}.card-green{background:rgba(0,232,122,.08);border-color:rgba(0,232,122,.35)}.card-red{background:rgba(255,95,95,.08);border-color:rgba(255,95,95,.3)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px}.badge-active{background:rgba(0,232,122,.12);border:1px solid rgba(0,232,122,.4);color:var(--green)}.badge-completed{background:var(--goldDim);border:1px solid var(--goldBdr);color:var(--gold)}.badge-expired{background:rgba(255,95,95,.1);border:1px solid rgba(255,95,95,.35);color:var(--red)}
/* home */
.home-logo{font-size:56px;margin-bottom:16px;text-align:center}.home-title{color:var(--gold);font-size:26px;font-weight:700;margin-bottom:6px;text-align:center}.home-sub{color:var(--muted);font-size:13px;margin-bottom:28px;text-align:center;line-height:1.5}
.home-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.feat{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 10px;text-align:center}
.feat-icon{font-size:22px;margin-bottom:8px}.feat-title{color:var(--gold);font-size:11px;font-weight:700;margin-bottom:4px}.feat-desc{color:var(--dim);font-size:10px;line-height:1.4}
/* folio header */
.fhdr{background:var(--navy3);border:1px solid var(--goldBdr);border-radius:var(--r);padding:18px;margin-bottom:14px}
.feyebrow{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.fnum{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;letter-spacing:3px}
.fowner{color:var(--muted);font-size:13px;margin-top:4px}
.fmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fexpiry{color:var(--dim);font-size:11px;text-align:right;line-height:1.5}
.prog-wrap{margin-top:14px}.prog-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.prog-meta span:last-child{color:var(--gold);font-weight:700}
.prog-bg{background:rgba(255,255,255,.1);border-radius:4px;height:6px;overflow:hidden}.prog-fill{background:var(--gold);height:100%;border-radius:4px;transition:width .6s ease}
/* tickets */
.tlist{display:flex;flex-direction:column;gap:10px}
.tkt{position:relative;background:var(--card);border:1px solid var(--goldBdr);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start;overflow:hidden}
.tkt.used{opacity:.48;border-color:var(--bdr)}.tkt.final{border:2px solid var(--gold)}
.tkt-icon{font-size:34px;line-height:1;flex-shrink:0}.tkt-num{position:absolute;top:10px;right:12px;font-size:11px;color:var(--dim);font-weight:700}
.tkt-body{flex:1;min-width:0}.tkt-title{font-size:15px;font-weight:700;margin-bottom:5px;padding-right:36px;line-height:1.3}.tkt-desc{color:var(--muted);font-size:12px;line-height:1.55;margin-bottom:12px}
.tkt-code-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tkt-code{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:3px;color:var(--gold);background:var(--goldDim);padding:5px 14px;border-radius:8px;border:1px solid var(--goldBdr)}
.tkt-code.dimmed{color:var(--dim);background:rgba(255,255,255,.04);border-color:var(--bdr)}.tkt-used-at{font-size:11px;color:var(--dim)}
.tkt-stamp{position:absolute;top:50%;right:14px;transform:translateY(-50%) rotate(-12deg);border:2px solid rgba(255,95,95,.4);border-radius:6px;padding:3px 10px;color:rgba(255,95,95,.4);font-size:12px;font-weight:800;letter-spacing:2px;pointer-events:none}
.done-banner{background:var(--goldDim);border:1px solid var(--goldBdr);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:14px}
.done-banner h3{color:var(--gold);font-size:17px;margin-bottom:6px}.done-banner p{color:var(--muted);font-size:13px}
/* validar */
.val-title{color:var(--gold);font-size:22px;font-weight:700;margin-bottom:6px}.val-sub{color:var(--muted);font-size:13px;margin-bottom:24px}
/* admin */
.admin-tabs{display:flex;gap:6px;margin-bottom:20px}
.atab{flex:1;padding:12px 6px;border-radius:var(--rs);border:1px solid var(--bdr);color:var(--muted);background:transparent;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;min-height:46px}
.atab.active{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;text-align:center}
.stat-n{font-size:40px;font-weight:700;line-height:1;margin-top:6px}
.lrow{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lrow:active{border-color:var(--goldBdr)}.lfolio{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--gold)}.lname{color:var(--muted);font-size:12px;margin-top:2px}.lright{display:flex;gap:8px;align-items:center;flex-shrink:0}.lcount{color:var(--muted);font-size:12px}
.clink{background:rgba(255,255,255,.05);border-radius:var(--rs);padding:12px 14px;word-break:break-all;font-size:12px;color:var(--gold);margin-bottom:14px;border:1px solid var(--goldBdr)}
.copy-row{display:flex;gap:8px;flex-wrap:wrap}
/* utils */
.center{text-align:center}.hidden{display:none!important}.row{display:flex;gap:10px}.row>*{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.spinner{text-align:center;padding:40px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="shell">
  <header id="topbar">
    <div class="brand" onclick="go('home')">
      <div class="brand-name">BALANDRA</div>
      <div class="brand-sub">Radisson · Puerto Varas</div>
    </div>
    <div id="tbr"></div>
  </header>
  <main id="content"></main>
  <nav id="bnav">
    <button class="nb" id="nb-home"   onclick="go('home')"  ><span class="nb-icon">🎟️</span>Mi Ticket</button>
    <button class="nb" id="nb-validar"onclick="go('validar')"><span class="nb-icon">✅</span>Validar</button>
    <button class="nb" id="nb-admin"  onclick="go('admin')" ><span class="nb-icon">⚙️</span>Admin</button>
  </nav>
</div>
<script>
const SB='https://wrtljewcclhqogkedsib.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndydGxqZXdjY2xocW9na2Vkc2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NDAzNTUsImV4cCI6MjA4MjQxNjM1NX0.FzxNYfIHE4R5IItHR-RfR5ebXU2lKP8R6s4zGNkxY_w';
const APW='balandra2026';
const BASE=location.origin+location.pathname.replace(/\/?$/,'/');
let adminAuth=false;
async function rpc(fn,p={}){const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw new Error(await r.text());return r.json()}
function getR(){const h=location.hash.replace(/^#\/?/,'');const[page,param]=h.split('/');return{page:page||'home',param:param||''}}
function go(page,param=''){location.hash=param?`/${page}/${param}`:`/${page}`}
function fdate(d){if(!d)return'—';return new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}
function fdtm(d){if(!d)return'';return new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
window.addEventListener('hashchange',render);
window.addEventListener('load',()=>{if(!location.hash)location.hash='/home';render()});
function render(){const{page,param}=getR();rnav(page);rtbr(page,param);const c=document.getElementById('content');if(page==='home')rHome(c);else if(page==='ticketera')rTicketera(c,param);else if(page==='validar')rValidar(c);else if(page==='admin')rAdmin(c);else rHome(c)}
function rnav(page){['home','validar','admin'].forEach(p=>{const el=document.getElementById('nb-'+p);if(el)el.classList.toggle('active',page===p||(page==='ticketera'&&p==='home'))})}
function rtbr(page,param){const el=document.getElementById('tbr');if(page==='ticketera'&&param)el.innerHTML=`<button class="btn btn-dim" style="padding:8px 12px;font-size:12px" onclick="rTicketera(document.getElementById('content'),'${param}')">⟳</button>`;else el.innerHTML=''}
/* HOME */
function rHome(c){c.innerHTML=`<div style="padding-top:20px">
<div class="home-logo">🎟️</div>
<h1 class="home-title">Ticketera Electrónica</h1>
<p class="home-sub">Balandra Restaurant<br>Radisson Hotel · Puerto Varas</p>
<div class="card card-gold">
  <label class="label">Ingresa tu número de folio</label>
  <input id="fi" class="input input-folio" placeholder="BAL-26-00001" maxlength="14" autocapitalize="characters" autocorrect="off" spellcheck="false">
  <div id="he" class="err hidden"></div>
  <button id="lb" class="btn btn-gold btn-full mt12">Ver mi Ticketera →</button>
</div>
<div class="home-feats">
  <div class="feat"><div class="feat-icon">🎁</div><p class="feat-title">10 beneficios</p><p class="feat-desc">Descuentos y experiencias exclusivas</p></div>
  <div class="feat"><div class="feat-icon">🔐</div><p class="feat-title">Código único</p><p class="feat-desc">Ticket infalsificable de 6 letras</p></div>
  <div class="feat"><div class="feat-icon">🥂</div><p class="feat-title">Premio final</p><p class="feat-desc">Botella de vino al completar</p></div>
</div></div>`;
const inp=document.getElementById('fi'),btn=document.getElementById('lb'),err=document.getElementById('he');
inp.oninput=()=>inp.value=inp.value.toUpperCase();
inp.onkeydown=e=>{if(e.key==='Enter')loadF()};
btn.onclick=loadF}
async function loadF(){const inp=document.getElementById('fi'),err=document.getElementById('he'),btn=document.getElementById('lb'),v=inp.value.trim().toUpperCase();if(!v)return;btn.textContent='Buscando...';btn.disabled=true;err.classList.add('hidden');try{const d=await rpc('balandra_get_ticketera',{p_folio:v});if(d.success)go('ticketera',d.folio);else{err.textContent=d.error||'No encontrada';err.classList.remove('hidden')}}catch{err.textContent='Error de conexión.';err.classList.remove('hidden')}btn.textContent='Ver mi Ticketera →';btn.disabled=false}
/* TICKETERA */
async function rTicketera(c,folio){if(!folio){go('home');return}c.innerHTML='<div class="spinner">Cargando tu ticketera...</div>';try{const d=await rpc('balandra_get_ticketera',{p_folio:folio.toUpperCase()});if(!d.success){c.innerHTML=`<div class="center" style="padding-top:40px"><p style="color:var(--red);font-size:16px;margin-bottom:16px">✗ ${d.error||'No encontrada'}</p><button class="btn btn-ghost" onclick="go('home')">Volver</button></div>`;return}
const pct=Math.round((d.used_tickets/d.total_tickets)*100),exp=fdate(d.expiry_date);
const smap={active:'badge-active',completed:'badge-completed',expired:'badge-expired'};
const slab={active:'ACTIVA',completed:'COMPLETADA',expired:'VENCIDA'};
const done=d.status==='completed'?`<div class="done-banner"><div style="font-size:44px;margin-bottom:10px">🎉</div><h3>¡Completaste tu Ticketera!</h3><p>Retira tu botella de vino en caja<br>presentando el folio <strong style="color:var(--gold)">${d.folio}</strong></p></div>`:'';
const tkts=(d.tickets||[]).map(t=>{const used=t.status==='used',final=t.ticket_number===10,uat=t.used_at?fdtm(t.used_at):'';return`<div class="tkt ${used?'used':''} ${final&&!used?'final':''}">
${used?'<div class="tkt-stamp">USADO</div>':''}
<div class="tkt-num">#${t.ticket_number}/10</div>
<div class="tkt-icon">${t.benefit_icon}</div>
<div class="tkt-body">
  <p class="tkt-title">${t.benefit_title}</p>
  <p class="tkt-desc">${t.benefit_description}</p>
  <div class="tkt-code-row"><span class="tkt-code${used?' dimmed':''}">${t.validation_code}</span>${used&&uat?`<span class="tkt-used-at">${uat}</span>`:''}</div>
</div></div>`}).join('');
c.innerHTML=`${done}<div class="fhdr"><div class="fmeta"><div><p class="feyebrow">Folio</p><p class="fnum">${d.folio}</p><p class="fowner">${d.owner_name||'Cliente Balandra'}</p></div><div style="text-align:right"><span class="badge ${smap[d.status]||'badge-active'}">${slab[d.status]||d.status}</span><p class="fexpiry">Válida hasta<br>${exp}</p></div></div><div class="prog-wrap"><div class="prog-meta"><span style="color:var(--muted)">Progreso</span><span>${d.used_tickets}/${d.total_tickets} usados</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div></div></div><div class="tlist">${tkts}</div>`}catch{c.innerHTML='<p class="center" style="color:var(--red);padding:40px">Error de conexión.</p>'}}
/* VALIDAR */
function rValidar(c){c.innerHTML=`<div style="padding-top:8px"><h2 class="val-title">Validar Ticket</h2><p class="val-sub">Ingresa el código de 6 caracteres del ticket del cliente</p><div id="vres"></div><div id="vform"><div class="field"><label class="label">Código del ticket</label><input id="vc" class="input input-code" placeholder="XXXXXX" maxlength="6" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text"></div><div class="row field"><div><label class="label">Garzón / Cajero</label><input id="vs" class="input" placeholder="Tu nombre" style="font-size:15px"></div><div style="max-width:90px"><label class="label">Mesa</label><input id="vt" class="input" placeholder="12" style="font-size:15px"></div></div><div id="verr" class="err hidden"></div><button id="vbtn" class="btn btn-gold btn-full">Quemar Ticket 🔥</button></div></div>`;
const vc=document.getElementById('vc'),btn=document.getElementById('vbtn');
vc.oninput=()=>vc.value=vc.value.toUpperCase();
vc.onkeydown=e=>{if(e.key==='Enter')quemar()};
btn.onclick=quemar;
setTimeout(()=>vc.focus(),200)}
async function quemar(){const code=(document.getElementById('vc')||{}).value||'',staff=(document.getElementById('vs')||{}).value||'Caja',table=(document.getElementById('vt')||{}).value||null,err=document.getElementById('verr'),btn=document.getElementById('vbtn'),res=document.getElementById('vres'),form=document.getElementById('vform');
if(code.length<4){err.textContent='El código debe tener 6 caracteres';err.classList.remove('hidden');return}
btn.textContent='Validando...';btn.disabled=true;err.classList.add('hidden');
try{const d=await rpc('balandra_use_ticket',{p_code:code.toUpperCase(),p_staff:staff,p_table:table});
if(d.success){form.classList.add('hidden');const last=d.remaining===0;
res.innerHTML=`<div class="card card-green center" style="padding:28px 20px"><div style="font-size:60px;margin-bottom:14px">${last?'🎉':'✅'}</div><p style="color:var(--green);font-size:22px;font-weight:700;margin-bottom:8px">${last?'¡Ticketera Completa!':'Ticket Válido'}</p><p style="font-size:17px;font-weight:600;margin-bottom:6px">${d.benefit}</p><p style="color:var(--muted);font-size:13px;margin-bottom:4px">Folio <strong style="color:var(--gold)">${d.folio}</strong> · Ticket #${d.ticket_number}</p>${d.owner?`<p style="color:var(--muted);font-size:13px;margin-bottom:8px">Cliente: ${d.owner}</p>`:''}<div style="display:inline-block;background:rgba(255,255,255,.06);border-radius:20px;padding:8px 20px;color:var(--muted);font-size:13px;margin:12px 0 20px">${last?'🍾 <strong style="color:var(--gold)">Entregar botella de vino</strong>':`Quedan <strong style="color:var(--gold);font-size:18px">${d.remaining}</strong> ticket(s)`}</div><button class="btn btn-green btn-full" onclick="rValidar(document.getElementById('content'))">Validar Otro Ticket</button></div>`}
else{err.textContent=d.error||'Error desconocido';err.classList.remove('hidden');btn.textContent='Quemar Ticket 🔥';btn.disabled=false}}
catch{err.textContent='Error de conexión.';err.classList.remove('hidden');btn.textContent='Quemar Ticket 🔥';btn.disabled=false}}
/* ADMIN */
function rAdmin(c){if(!adminAuth){rAdminLogin(c);return}
c.innerHTML=`<div><div class="admin-tabs"><button class="atab active" id="at-d" onclick="asw('d',this)">Dashboard</button><button class="atab" id="at-c" onclick="asw('c',this)">Nueva</button><button class="atab" id="at-l" onclick="asw('l',this)">Listado</button></div><div id="ap-d">${dashH()}</div><div id="ap-c" class="hidden">${crearH()}</div><div id="ap-l" class="hidden"><div id="la" class="spinner">Cargando...</div></div><div class="center mt16"><button class="btn btn-dim" style="font-size:12px" onclick="adminAuth=false;go('home')">Cerrar sesión</button></div></div>`;
loadStats();document.getElementById('cbtn').onclick=crearT}
function asw(n,el){['d','c','l'].forEach(x=>{document.getElementById('ap-'+x).classList.toggle('hidden',x!==n);document.getElementById('at-'+x).classList.toggle('active',x===n)});if(n==='l')loadL();if(n==='d')loadStats()}
function dashH(){return`<div class="stat-grid"><div class="stat"><p class="label">Ticketeras</p><p class="stat-n" style="color:var(--gold)" id="s1">—</p></div><div class="stat"><p class="label">Activas</p><p class="stat-n" style="color:var(--green)" id="s2">—</p></div><div class="stat"><p class="label">Completadas</p><p class="stat-n" style="color:var(--gold)" id="s3">—</p></div><div class="stat"><p class="label">Tickets usados</p><p class="stat-n" style="color:#64b5f6" id="s4">—</p></div></div><div class="center"><button class="btn btn-ghost" onclick="loadStats()">⟳ Actualizar</button></div>`}
function crearH(){return`<div><div class="field"><label class="label">Nombre del cliente</label><input id="cn" class="input" placeholder="María González" style="font-size:16px"></div><div class="field"><label class="label">Email</label><input id="ce" class="input" type="email" placeholder="cliente@email.com" style="font-size:16px"></div><div class="field"><label class="label">Teléfono</label><input id="cp" class="input" type="tel" placeholder="+56912345678" style="font-size:16px"></div><div id="cce" class="err hidden"></div><button id="cbtn" class="btn btn-gold btn-full">Generar Ticketera</button><div id="cres"></div></div>`}
async function loadStats(){try{const s=await rpc('balandra_get_stats');[['s1','total_ticketeras'],['s2','activas'],['s3','completadas'],['s4','tickets_usados']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.textContent=s[k]??'0'})}catch{}}
async function loadL(){const a=document.getElementById('la');if(!a)return;try{const list=await rpc('balandra_list_ticketeras');const arr=Array.isArray(list)?list:[];if(!arr.length){a.innerHTML='<p class="center" style="color:var(--muted);padding:20px">Sin ticketeras aún.</p>';return}const sm={active:'badge-active',completed:'badge-completed',expired:'badge-expired'};const sl={active:'ACTIVA',completed:'COMPLETADA',expired:'VENCIDA'};a.innerHTML=arr.map(t=>`<div class="lrow" onclick="go('ticketera','${t.folio}')"><div><div class="lfolio">${t.folio}</div><div class="lname">${t.owner_name||'Sin nombre'}${t.owner_email?' · '+t.owner_email:''}</div></div><div class="lright"><span class="lcount">${t.used_tickets}/${t.total_tickets}</span><span class="badge ${sm[t.status]||'badge-active'}">${sl[t.status]||t.status}</span></div></div>`).join('')}catch{a.innerHTML='<p class="center" style="color:var(--red)">Error.</p>'}}
async function crearT(){const name=document.getElementById('cn').value.trim(),email=document.getElementById('ce').value.trim(),phone=document.getElementById('cp').value.trim(),err=document.getElementById('cce'),btn=document.getElementById('cbtn'),res=document.getElementById('cres');
btn.textContent='Generando...';btn.disabled=true;err.classList.add('hidden');
try{const d=await rpc('balandra_create_ticketera',{p_owner_name:name,p_owner_email:email,p_owner_phone:phone});
if(d.success){const link=`${BASE}#/ticketera/${d.folio}`,exp=fdate(d.expiry_date);
res.innerHTML=`<div class="card card-green mt12"><p style="color:var(--green);font-weight:700;margin-bottom:10px">✓ Ticketera creada</p><p style="font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;letter-spacing:3px;color:var(--gold)">${d.folio}</p><p style="color:var(--muted);font-size:12px;margin-top:4px;margin-bottom:14px">Válida hasta ${exp}</p><p style="color:var(--dim);font-size:11px;margin-bottom:6px">Link del cliente:</p><div class="clink">${link}</div><div class="copy-row"><button class="btn btn-green" onclick="cp('${d.folio}')">Copiar folio</button><button class="btn btn-ghost" onclick="cp('${link}')">Copiar link</button></div></div>`;
document.getElementById('cn').value='';document.getElementById('ce').value='';document.getElementById('cp').value='';loadStats()}
else{err.textContent=d.error||'Error al crear';err.classList.remove('hidden')}}
catch{err.textContent='Error de conexión.';err.classList.remove('hidden')}
btn.textContent='Generar Ticketera';btn.disabled=false}
function rAdminLogin(c){c.innerHTML=`<div style="padding-top:40px;text-align:center"><div style="font-size:48px;margin-bottom:14px">🔐</div><h2 style="color:var(--gold);font-size:22px;font-weight:700;margin-bottom:24px">Administración</h2><div class="card card-gold"><div class="field"><label class="label">Contraseña</label><input id="apin" type="password" class="input" style="text-align:center;font-size:20px;letter-spacing:4px" placeholder="••••••••"></div><div id="aerr" class="err hidden"></div><button id="aln" class="btn btn-gold btn-full">Ingresar</button></div></div>`;
const inp=document.getElementById('apin');inp.onkeydown=e=>{if(e.key==='Enter')doL()};document.getElementById('aln').onclick=doL;setTimeout(()=>inp.focus(),200)}
function doL(){const p=(document.getElementById('apin')||{}).value||'',e=document.getElementById('aerr');if(p===APW){adminAuth=true;rAdmin(document.getElementById('content'))}else{e.textContent='Contraseña incorrecta';e.classList.remove('hidden')}}
function cp(t){if(navigator.clipboard)navigator.clipboard.writeText(t)}
</script>
</body>
</html>
