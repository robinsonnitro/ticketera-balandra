<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Ticketera Balandra · Radisson Puerto Varas</title>
<meta name="description" content="Ticketera Electrónica Balandra · Radisson Hotel Puerto Varas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" async></script>
<style>
:root{
  --navy:#0a1628;--navy2:#0d1e35;--navy3:#142540;
  --gold:#D4AF37;--goldBg:rgba(212,175,55,.12);--goldBdr:rgba(212,175,55,.35);
  --white:#f0f4f8;--muted:rgba(240,244,248,.6);--dim:rgba(240,244,248,.35);
  --green:#00e87a;--gBg:rgba(0,232,122,.09);--gBdr:rgba(0,232,122,.4);
  --red:#ff5f5f;--rBg:rgba(255,95,95,.09);
  --card:rgba(255,255,255,.07);--cardBdr:rgba(255,255,255,.11);
  --r:14px;--rsm:10px;--nav:66px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--navy)}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);min-height:100%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--navy2);border-bottom:1px solid var(--goldBdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;min-height:62px}
.topbar-logos{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.logo-balandra{height:38px;width:auto;object-fit:contain;filter:brightness(1.05)}
.logo-divider{width:1px;height:28px;background:var(--goldBdr)}
.logo-radisson{height:32px;width:auto;object-fit:contain;border-radius:6px;background:#fff;padding:3px 7px}
.tbtn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif;min-height:36px;transition:opacity .15s}
.tbtn:active{opacity:.75}
.tbtn-g{background:var(--goldBg);color:var(--gold)}
.tbtn-d{background:var(--card);color:var(--muted)}
.staff-label{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* ── MAIN ── */
.main{flex:1;padding:16px 16px 32px;max-width:600px;margin:0 auto;width:100%}
.main-nav{padding-bottom:calc(var(--nav) + 20px)}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--navy2);border-top:1px solid var(--cardBdr);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--dim);font-family:'Inter',sans-serif;padding:8px 4px;-webkit-tap-highlight-color:transparent;transition:color .15s}
.bni:active{background:rgba(255,255,255,.04)}
.bni.on{color:var(--gold)}
.bni-ico{font-size:22px;line-height:1}
.bni-lbl{font-size:10px;font-weight:700;letter-spacing:.5px}
.bni-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:0;margin-top:1px}
.bni.on .bni-dot{opacity:1}

/* ── BUTTONS ── */
.bp{width:100%;padding:15px;border-radius:var(--rsm);background:var(--gold);border:none;color:var(--navy);font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;min-height:52px;transition:opacity .15s}
.bp:active{opacity:.85}
.bp:disabled{background:var(--card);color:var(--dim);cursor:not-allowed}
.bs{padding:10px 20px;border-radius:var(--rsm);background:transparent;border:1px solid var(--goldBdr);color:var(--gold);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;min-height:42px;transition:opacity .15s}
.bs:active{opacity:.75}
.bg{padding:13px 28px;border-radius:var(--rsm);background:var(--green);border:none;color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;min-height:48px}
.bg:active{opacity:.85}
.bwa{padding:13px 20px;border-radius:var(--rsm);background:#25D366;border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.bwa:active{opacity:.85}

/* ── INPUTS ── */
.fld{margin-bottom:14px}
.lbl{color:var(--muted);font-size:12px;font-weight:600;display:block;margin-bottom:7px;letter-spacing:.3px}
.inp{width:100%;padding:13px 16px;border-radius:var(--rsm);border:1.5px solid var(--cardBdr);background:rgba(255,255,255,.06);color:var(--white);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;min-height:50px;-webkit-appearance:none}
.inp:focus{border-color:var(--goldBdr)}
.inp-folio{font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;letter-spacing:4px;padding:16px}
.inp-code{font-family:'JetBrains Mono',monospace;font-size:34px;text-align:center;letter-spacing:10px;padding:18px;min-height:74px}
.err{color:var(--red);font-size:13px;text-align:center;padding:8px 0}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--cardBdr);border-radius:var(--r);padding:18px}
.card-g{border-color:var(--goldBdr)}
.card-gr{background:var(--gBg);border-color:var(--gBdr)}

/* ── BADGES ── */
.bdg{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px}
.ba{background:var(--gBg);border:1px solid var(--gBdr);color:var(--green)}
.bc{background:var(--goldBg);border:1px solid var(--goldBdr);color:var(--gold)}
.be{background:var(--rBg);border:1px solid rgba(255,95,95,.4);color:var(--red)}
.bf{background:rgba(147,112,219,.1);border:1px solid rgba(147,112,219,.4);color:#c196f0}

/* ── FOLIO HEADER ── */
.fhdr{background:var(--navy3);border:1px solid var(--goldBdr);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.feye{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:5px}
.fnum{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;letter-spacing:3px}
.fname{color:var(--muted);font-size:13px;margin-top:4px}
.frow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.fright{text-align:right;flex-shrink:0}
.fexp{color:var(--dim);font-size:11px;margin-top:6px;line-height:1.45}
.prog{margin-top:14px}
.prog-row{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px}
.prog-bg{background:rgba(255,255,255,.1);border-radius:4px;height:7px;overflow:hidden}
.prog-bar{background:var(--gold);height:100%;border-radius:4px;transition:width .6s ease}

/* ── SHARE STRIP (ticketera client) ── */
.share-strip{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.share-strip button{flex:1;min-width:120px}

/* ── TICKETS ── */
.tlist{display:flex;flex-direction:column;gap:10px}
.tkt{background:var(--card);border:1px solid var(--goldBdr);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden}
.tkt.used{opacity:.4;border-color:var(--cardBdr)}
.tkt.last{border:2px solid var(--gold)}
.tkt-seq{position:absolute;top:10px;right:12px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.5px}
.tkt-ico{font-size:34px;line-height:1;flex-shrink:0;margin-top:2px}
.tkt-body{flex:1;min-width:0}
.tkt-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:5px;padding-right:30px;line-height:1.3}
.tkt-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:11px}
.coderow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vcode{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--gold);background:var(--goldBg);padding:5px 12px;border-radius:7px;border:1px solid var(--goldBdr)}
.vcode.dim{color:var(--dim);background:rgba(255,255,255,.03);border-color:var(--cardBdr)}
.used-t{font-size:10px;color:var(--dim)}
.tkt-wa{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border-radius:8px;background:#25D366;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.tkt-wa:active{opacity:.8}
.stamp{position:absolute;top:50%;right:12px;transform:translateY(-50%) rotate(-12deg);border:2px solid rgba(255,95,95,.4);border-radius:4px;padding:2px 8px;color:rgba(255,95,95,.45);font-size:11px;font-weight:800;letter-spacing:2px;pointer-events:none}

/* ── STATS ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--cardBdr);border-radius:var(--r);padding:18px;text-align:center}
.sv{font-size:40px;font-weight:700;margin-top:6px;line-height:1}

/* ── LIST ── */
.lrow{background:var(--card);border:1px solid var(--cardBdr);border-radius:var(--rsm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.lrow:active{border-color:var(--goldBdr);background:rgba(255,255,255,.09)}
.lfolio{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);font-weight:700}
.lname{color:var(--muted);font-size:12px;margin-top:2px}

/* ── TABS ── */
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--cardBdr);color:var(--muted);background:transparent;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;min-height:38px;transition:all .15s}
.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* ── FEATURES HOME ── */
.fgrid{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.fcard{background:var(--card);border:1px solid var(--cardBdr);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center}
.fico{font-size:28px;flex-shrink:0}
.ftit{color:var(--gold);font-size:13px;font-weight:700;margin-bottom:3px}
.fdsc{color:var(--dim);font-size:12px;line-height:1.45}

/* ── GIFT ── */
.gift{background:var(--goldBg);border:1px solid var(--goldBdr);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:16px}

/* ── UTIL ── */
.stit{font-size:16px;font-weight:700;margin-bottom:6px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{text-align:center}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.mt20{margin-top:20px}
.divider{width:100%;height:1px;background:var(--cardBdr);margin:16px 0}
</style>
</head>

<script>
const SB='https://wrtljewcclhqogkedsib.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndydGxqZXdjY2xocW9na2Vkc2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NDAzNTUsImV4cCI6MjA4MjQxNjM1NX0.FzxNYfIHE4R5IItHR-RfR5ebXU2lKP8R6s4zGNkxY_w';
const PW='balandra2026';
let adminOk=false;

async function rpc(fn,p={}){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(p)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

const fd=d=>d?new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'}):'—';
const fdt=d=>d?new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

function getR(){const h=location.hash.replace('#','').replace(/^\//,'');const[p,q]=h.split('/');return{p:p||'home',q:q||''}}
function nav(p,q=''){location.hash=q?`/${p}/${q}`:`/${p}`}

window.addEventListener('hashchange',render);
window.addEventListener('load',()=>{if(!location.hash||location.hash==='#')location.hash='/home';render()});

function render(){
  if(qrScanner){qrScanner.stop().catch(()=>{});qrScanner=null;}
  const{p,q}=getR();
  const m=document.getElementById('main');
  const bnav=document.getElementById('bnav');
  const tbr=document.getElementById('tbr');

  if(p==='home'||p==='ticketera'){
    bnav.style.display='none';
    m.className='main';
    tbr.innerHTML=p==='ticketera'?'<button class="tbtn tbtn-d" onclick="nav(\'home\')">← Inicio</button>':'';
    if(p==='home'){m.innerHTML=hHome();bHome();}
    else{m.innerHTML='<p style="color:var(--muted);text-align:center;padding:40px 0">Cargando...</p>';loadTkt(q,m);}
    return;
  }

  // Garzón: sin nav inferior. Admin: con nav entre validar y admin
  bnav.style.display=p==='admin'?'flex':'none';
  m.className=p==='admin'?'main main-nav':'main';
  ['bn0','bn1'].forEach(id=>document.getElementById(id).classList.remove('on'));
  if(p==='admin')document.getElementById('bn1').classList.add('on');

  if(p==='validar'){
    tbr.innerHTML='<span class="staff-label">Caja · Garzón</span>';
    m.innerHTML=hVal();bVal();
  }else if(p==='admin'){
    tbr.innerHTML=adminOk?'<button class="tbtn tbtn-d" onclick="adminOk=false;nav(\'home\')">Salir</button>':'<span class="staff-label">Administración</span>';
    m.innerHTML=adminOk?hAdmin():hLogin();
    adminOk?setTimeout(loadStats,80):bLogin();
  }
}

function hHome(){return`
<div style="padding-top:8px">
  <h1 style="font-size:22px;font-weight:700;color:var(--gold);margin-bottom:4px">Tu Ticketera</h1>
  <p style="color:var(--muted);font-size:13px;margin-bottom:22px">Ingresa tu folio para ver tus beneficios</p>
  <div class="card card-g" style="margin-bottom:24px">
    <div class="fld">

      <input id="fi" class="inp inp-folio" placeholder="BAL-26-00001" maxlength="14" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div id="he" class="err" style="display:none"></div>
    <button id="hb" class="bp">Ver mi Ticketera →</button>
  </div>
  <div class="fgrid">

    <div class="fcard"><div class="fico">🔐</div><div><p class="ftit">Tickets seguros</p><p class="fdsc">Código único de 6 caracteres, infalsificable y de un solo uso</p></div></div>
    <div class="fcard"><div class="fico">🥂</div><div><p class="ftit">Premio final</p><p class="fdsc">Botella de vino Casillero del Diablo al completar los 10 tickets</p></div></div>
  </div>
</div>`}

function bHome(){
  const fi=document.getElementById('fi'),hb=document.getElementById('hb');
  fi.oninput=()=>fi.value=fi.value.toUpperCase();
  fi.onkeydown=e=>e.key==='Enter'&&doHome();
  hb.onclick=doHome;
}
async function doHome(){
  const fi=document.getElementById('fi'),he=document.getElementById('he'),hb=document.getElementById('hb');
  if(!fi||!fi.value.trim())return;
  hb.textContent='Buscando...';hb.disabled=true;he.style.display='none';
  try{
    const d=await rpc('balandra_get_ticketera',{p_folio:fi.value.trim().toUpperCase()});
    if(d.success)nav('ticketera',d.folio);
    else{he.textContent=d.error||'Ticketera no encontrada';he.style.display='block';}
  }catch{he.textContent='Error de conexión. Intenta nuevamente.';he.style.display='block';}
  hb.textContent='Ver mi Ticketera →';hb.disabled=false;
}

async function loadTkt(folio,m){
  if(!folio){m.innerHTML=`<div style="text-align:center;padding:40px"><p style="color:var(--red);margin-bottom:16px">Folio no indicado</p><button class="bs" onclick="nav('home')">← Inicio</button></div>`;return}
  try{
    const d=await rpc('balandra_get_ticketera',{p_folio:folio.toUpperCase()});
    if(!d.success){m.innerHTML=`<div style="text-align:center;padding:40px"><p style="color:var(--red);font-size:15px;margin-bottom:16px">✗ ${d.error||'No encontrada'}</p><button class="bs" onclick="nav('home')">← Inicio</button></div>`;return;}
    m.innerHTML=hTkt(d);
  }catch{m.innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">Error de conexión</div>';}
}

function waMsg(folio,link,name){
  const n=name?'*'+name+'*, t':'T';
  return encodeURIComponent(`🎟️ *Tu Ticketera Balandra*\n\n${n}u ticketera ya está lista en el Restaurante Balandra, Hotel Radisson Puerto Varas.\n\n📋 *Folio:* ${folio}\n🔗 *Link:* ${link}\n\n✨ Tienes 10 tickets con descuentos y beneficios exclusivos. Al usar el último ticket recibirás una botella de vino de regalo 🥂\n\n_Válida por 6 meses. Muestra el código en caja._`);
}

function hTkt(t){
  const pct=Math.round((t.used_tickets/t.total_tickets)*100);
  const sm={active:'ba',completed:'bc',expired:'be',gifted:'bf'};
  const sl={active:'ACTIVA',completed:'COMPLETADA',expired:'VENCIDA',gifted:'REGALADA'};
  const link=`${location.origin}${location.pathname}#/ticketera/${t.folio}`;
  const waUrl=`https://wa.me/?text=${waMsg(t.folio,link,t.owner_name)}`;
  const comp=t.status==='completed'?`<div class="gift"><div style="font-size:38px;margin-bottom:8px">🎉</div><p style="color:var(--gold);font-size:16px;font-weight:700;margin-bottom:4px">¡Ticketera Completada!</p><p style="color:var(--muted);font-size:12px">Retira tu botella de vino · Folio <strong style="color:var(--gold)">${t.folio}</strong></p></div>`:'';
  const tkts=(t.tickets||[]).map(tk=>{
    const u=tk.status==='used',ls=tk.ticket_number===10&&!u;
    const tktMsg=encodeURIComponent(`🎟️ Te regalo este ticket de Balandra\n\n${tk.benefit_icon} *${tk.benefit_title}*\n${tk.benefit_description}\n\n🔑 Código para usar en caja: *${tk.validation_code}*\n\n📍 Balandra Restaurant · Hotel Radisson Puerto Varas\nMuéstraselo al garzón antes de pagar. Válido hasta ${fd(t.expiry_date)}.`);
    const tktWa=`https://wa.me/?text=${tktMsg}`;
    return`<div class="tkt ${u?'used':''} ${ls?'last':''}">
      ${u?'<div class="stamp">USADO</div>':''}
      <div class="tkt-seq">#${tk.ticket_number}/10</div>
      <div class="tkt-ico">${tk.benefit_icon}</div>

let qrScanner=null;
function bVal(){
  const vc=document.getElementById('vc'),vb=document.getElementById('vb'),bc=document.getElementById('btn-camara');
  if(vc){vc.oninput=()=>vc.value=vc.value.toUpperCase();vc.onkeydown=e=>{if(e.key==='Enter')doVal();};}
  if(vb)vb.onclick=doVal;
  if(bc)bc.onclick=startScanner;
}
function startScanner(){
  if(typeof Html5Qrcode==='undefined'){
    const ve=document.getElementById('ve');
    ve.textContent='Escáner no disponible en este dispositivo. Usa el código manual.';
    ve.style.display='block';
    return;
  }
  document.getElementById('scan-area').style.display='none';
  document.getElementById('qr-wrap').style.display='block';
  qrScanner=new Html5Qrcode('qr-reader');
  qrScanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:230,height:230}},
    (code)=>{
      document.getElementById('qr-status').textContent='✅ QR detectado — validando…';
      qrScanner.stop().catch(()=>{});
      doValWithCode(code.trim().toUpperCase());
    }
  ).catch(()=>{
    stopScanner();
    const ve=document.getElementById('ve');
    ve.textContent='No se pudo acceder a la cámara. Verifica los permisos e intenta de nuevo.';
    ve.style.display='block';
  });
}
function stopScanner(){
  if(qrScanner){qrScanner.stop().catch(()=>{});qrScanner=null;}
  const sa=document.getElementById('scan-area'),qw=document.getElementById('qr-wrap');
  if(sa)sa.style.display='block';
  if(qw)qw.style.display='none';
}
async function doVal(){
  const code=(document.getElementById('vc')||{}).value||'';
  if(code.length<4){const ve=document.getElementById('ve');ve.textContent='El código debe tener al menos 4 caracteres';ve.style.display='block';return;}
  await doValWithCode(code.toUpperCase());
}
async function doValWithCode(code){
  const staff=(document.getElementById('vs')||{}).value||'Caja';
  const table=(document.getElementById('vt')||{}).value||null;
  const ve=document.getElementById('ve'),vres=document.getElementById('vres'),vfrm=document.getElementById('vfrm');
  ve.style.display='none';
  try{
    const d=await rpc('balandra_use_ticket',{p_code:code,p_staff:staff,p_table:table});
    if(d.success){
      vfrm.style.display='none';
      const last=d.remaining===0;
      vres.innerHTML=`<div class="card card-gr"><div class="tc" style="padding:20px 10px">
        <div style="font-size:52px;margin-bottom:12px;line-height:1">${last?'🎉':'✅'}</div>
        <p style="color:var(--green);font-size:20px;font-weight:700;margin-bottom:6px">${last?'¡Completada!':'Ticket Válido'}</p>
        <p style="color:var(--white);font-size:16px;font-weight:700;margin-bottom:6px">${d.benefit}</p>
        <p style="color:var(--muted);font-size:13px;margin-bottom:2px">Folio <strong style="color:var(--gold)">${d.folio}</strong> · #${d.ticket_number}</p>
        ${d.owner?`<p style="color:var(--muted);font-size:13px;margin-bottom:0">Cliente: ${d.owner}</p>`:''}
        <div style="background:rgba(255,255,255,.06);border-radius:10px;padding:14px;margin:14px 0">
          ${last?`<p style="color:var(--gold);font-weight:700;font-size:14px">📦 Entregar botella de vino al cliente</p>`
            :`<p style="color:var(--muted);font-size:13px">Quedan <strong style="color:var(--gold);font-size:20px">${d.remaining}</strong> ticket(s)</p>`}
        </div>
        <button class="bg" onclick="nav('validar')">Validar Otro Ticket</button>
      </div></div>`;
    }else{ve.textContent=d.error||'Código inválido';ve.style.display='block';if(qrScanner)startScanner();}
  }catch{ve.textContent='Error de conexión.';ve.style.display='block';if(qrScanner)startScanner();}
}

          <p style="color:var(--dim);font-size:11px;margin-bottom:5px">Link del cliente:</p>
          <p style="font-size:12px;word-break:break-all;color:var(--gold)">${link}</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${phone?`<button class="bwa" onclick="window.open('${waUrl}','_blank')"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.862L0 24l6.337-1.508A11.946 11.946 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.793 9.793 0 01-5.001-1.374l-.357-.213-3.706.882.936-3.617-.233-.372A9.793 9.793 0 012.182 12c0-5.419 4.399-9.818 9.818-9.818 5.419 0 9.818 4.399 9.818 9.818 0 5.419-4.399 9.818-9.818 9.818z"/></svg>Enviar por WhatsApp a ${name}</button>`:''}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="bs" onclick="navigator.clipboard&&navigator.clipboard.writeText('${d.folio}').then(()=>alert('Folio copiado ✓'))">Copiar Folio</button>
            <button class="bs" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}').then(()=>alert('Link copiado ✓'))">Copiar Link</button>
          </div>
        </div>
      </div>`;
      ['cn','ce','cp'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    }else{cce.textContent=d.error||'Error al crear';cce.style.display='block';}
  }catch{cce.textContent='Error de conexión';cce.style.display='block';}
  ccb.textContent='Generar Ticketera';ccb.disabled=false;
}
</script>
</body>
